services:
  mongodb:
    image: mongodb/mongodb-community-server:7.0.5-ubi8
    container_name: mongodb
    restart: always
    ports:
      - "27020:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: 123
    volumes:
      - ./Data/mongo-data:/data/db
      - ./Data/mongo-config:/data/configdb
    networks:
      default:
        aliases:
          - mongo

  mongo-express:
    image: mongo-express:1.0.2-18
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: 123
      ME_CONFIG_BASICAUTH_USERNAME: root
      ME_CONFIG_BASICAUTH_PASSWORD: 123
    depends_on:
      - mongodb
    entrypoint: ["sh", "-c", "sleep 10 && tini -- /docker-entrypoint.sh mongo-express"]

networks:
  default:
    name: urlservice_net